[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "wiking"
description = "Wiking — Python web application development framework"
dynamic = ["version"]
authors = [
    { name = "Tomas Cerha", email = "cerha@truecode.cz" },
]
license = { file = "COPYING" }
readme = "readme.md"
requires-python = ">=2.7"
classifiers = [
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3.5",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
]
dependencies = [
    #"pytis",
    "lcg-framework[all]",
    "pbkdf2",
]

[project.optional-dependencies]
cms = [
    "dnspython",
]

[dependency-groups]
# Development dependencies, installed by 'pip install -e . --group dev' (or by
# naming the particular groups, such as '--group build --group test').

# Everything needed by 'make build' -- the tools generating the package data
# (see the Makefile) and the build backend itself.
build = ["babel", "pojson", "rjsmin", "flit"]
test = ["pytest", "coverage"]
lint = ["flake8"]
release = ["twine"]
dev = [
    {include-group = "build"},
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "release"},
]

[project.scripts]
cms-migrate = "wiking.cms.migrate:main"

[tool.flit.module]
name = "wiking"

[tool.flit.sdist]
include = [
    "COPYING",
    "wiking/assets/**",
    "wiking/**/test.py",  # Include in sdist even if excluded in .flitignore
]

